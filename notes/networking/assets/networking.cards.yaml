version: 1
deck: "Networking"
cards:
  - q: "What are the two parts of network speed?"
    a: "Latency (the waiting) and bandwidth (the pipe width). Latency is usually the bottleneck."
    tag: speed
  - q: "What is RTT?"
    a: "Round-trip time: the time to go there and back."
    tag: speed
  - q: "How do you make a site faster when latency is the problem?"
    a: "Cut round trips, move data closer (CDN), cache and prefetch."
    tag: speed
  - q: "What does the TCP three-way handshake do?"
    a: "SYN, SYN-ACK, ACK. It opens a connection and costs one round trip before any data."
    tag: tcp
  - q: "When do you use TCP, and when UDP?"
    a: |
      TCP: data must arrive complete and in order (files, JSON). Lost data is resent.
      UDP: no guarantee, no waiting. Use it when old data is worthless (calls, games, DNS).
    tag: tcp
  - q: "Why reuse connections instead of opening new ones?"
    a: "Every new connection pays the handshake (and TLS) round trips and starts with slow start. Reuse avoids all of it."
    tag: tcp
  - q: "What changes at every hop, and what stays the same?"
    a: |
      MAC addresses change: they only work on one link.
      IP addresses stay the same: they name the final destination.
    tag: routing
  - q: "Same subnet or not: where does the packet go?"
    a: |
      Same subnet: send directly.
      Anything else: send to the default gateway.
    tag: routing
  - q: "What does ARP do?"
    a: |
      Problem: the frame needs a MAC, but I only know the IP.
      Solution: check the cache, else broadcast "who has this IP?". The owner replies. For another subnet, ARP for the gateway's MAC.
    tag: routing
  - q: "What does NAT do?"
    a: "The router keeps a table: private IP:port to public IP:port. Many devices share one public IP, and replies are matched through the table."
    tag: nat
  - q: "Why are incoming packets dropped, and how do you let them in?"
    a: |
      Problem: an unrequested packet has no NAT table entry, so it is dropped.
      Solution: a public IP on the server, or port forwarding (a permanent table entry).
    tag: nat
  - q: "Why do NAT entries expire, and what fixes it?"
    a: |
      Problem: idle entries time out, so a long-lived connection silently breaks.
      Solution: keepalives, small packets that reset the timer.
    tag: nat
  - q: "What identifies a connection?"
    a: "Four things: source IP and port, destination IP and port."
    tag: nat
  - q: "What are the three jobs of TLS?"
    a: "Encryption (nobody can read it), authentication (the server is who it claims), integrity (nobody can change it unnoticed)."
    tag: tls
  - q: "What does a certificate prove?"
    a: "That the public key belongs to that server. A trusted CA signed it, and the chain ends at a root your browser or OS trusts."
    tag: tls
  - q: "What does a DNS A record do?"
    a: "Turns a name into a public IPv4 address. It knows nothing about ports or local servers."
    tag: basics
  - q: "What does a reverse proxy do?"
    a: "One front door that routes requests to many backends by hostname or path, and can end TLS once."
    tag: basics
